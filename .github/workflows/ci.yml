name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 单元测试（不联网、不调用真实模型）
        run: python -m unittest discover -s tests -v
      - name: 密钥检查
        run: python run.py guard
