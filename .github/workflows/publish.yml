name: Update and deploy SANDBOXHOT
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: '53 2-22/4 * * *'
concurrency:
  group: sandboxhot-production
  cancel-in-progress: false
permissions: {}
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - name: Collect and validate
        run: |
          mkdir -p state
          if [ -f data/cloud-runtime.json ]; then
            cp data/cloud-runtime.json state/runtime.json
          fi
          python run.py update --no-llm --force --require-content
          cp state/runtime.json data/cloud-runtime.json
          python run.py guard
      - name: Save history
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data docs
          if ! git diff --cached --quiet; then
            git commit -m 'Refresh SANDBOXHOT content'
            git push origin HEAD:main
          fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
  deploy:
    needs: update
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
